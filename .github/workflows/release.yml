name: Release

on:
  push:
    tags: ['v*']

env:
  LIB_NAME: pragma_lib

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-gnu
            lib_format: so
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-gnu
            lib_format: so
          - goos: darwin
            goarch: amd64
            zig_target: x86_64-macos
            lib_format: dylib
          - goos: darwin
            goarch: arm64
            zig_target: aarch64-macos
            lib_format: dylib
          - goos: windows
            goarch: amd64
            zig_target: ''
            lib_format: ''
          - goos: windows
            goarch: arm64
            zig_target: ''
            lib_format: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build guard library
        if: matrix.zig_target != ''
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          LIB_FORMAT: ${{ matrix.lib_format }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIB_FORMAT" = "so" ]; then
            zig cc -target "$ZIG_TARGET" -shared -fPIC -O2 \
              -o "${LIB_NAME}.so" csrc/restrict_open.c -ldl
          else
            zig cc -target "$ZIG_TARGET" -dynamiclib -O2 \
              -o "${LIB_NAME}.dylib" csrc/restrict_open.c
          fi

      - name: Build pragma
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = "windows" ]; then
            suffix=".exe"
          fi
          go build -trimpath -ldflags='-s -w' -o "pragma${suffix}" .

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LIB_FORMAT: ${{ matrix.lib_format }}
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/${GOOS}-${GOARCH}"
          mkdir -p "$dist"
          if [ "$GOOS" = "windows" ]; then
            cp pragma.exe "$dist/"
          else
            cp pragma "$dist/"
            cp "${LIB_NAME}.${LIB_FORMAT}" "$dist/"
          fi
          tar -czf "pragma-${GOOS}-${GOARCH}.tar.gz" -C "$dist" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pragma-${{ matrix.goos }}-${{ matrix.goarch }}
          path: pragma-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
